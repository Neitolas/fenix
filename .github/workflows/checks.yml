name: Verificações
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuração dos serviços
        env:
          DJANGO_SECRET_KEY: ci-only
          REPORT_SERVICE_TOKEN: ci-only
          MYSQL_DATABASE: fenix
          MYSQL_USER: fenix
          MYSQL_PASSWORD: ci-only
          MYSQL_ROOT_PASSWORD: ci-only
        run: docker compose --profile mysql config --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend scripts
      - run: ruff format --check backend scripts
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test config operations
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: php -l reports-php/index.php
      - run: php reports-php/tests.php
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - name: Testar integração Django e PHP por HTTP
        env:
          REPORT_SERVICE_TOKEN: ci-only-http-token
          REPORT_SERVICE_URL: http://127.0.0.1:9080
          RUN_REPORT_HTTP_TESTS: '1'
        run: |
          php -S 127.0.0.1:9080 -t reports-php reports-php/index.php >/tmp/fenix-php.log 2>&1 &
          PHP_PID=$!
          trap 'kill "$PHP_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9080/health; then break; fi
            sleep 1
          done
          python backend/manage.py test operations.test_report_http

  mysql:
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: fenix
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci-only-root --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_ENGINE: mysql
      MYSQL_DATABASE: fenix
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-only-root
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev
      - run: pip install -r backend/requirements-mysql.txt
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py seed_demo
      - run: python backend/manage.py seed_demo
      - run: python backend/manage.py test config operations

  integrated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SECRET_KEY: ci-only-full-stack-key-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ
      REPORT_SERVICE_TOKEN: ci-only-full-stack-report-token-0123456789-abcdefghijklmnop
      MYSQL_PASSWORD: ci-only-mysql-password
      MYSQL_ROOT_PASSWORD: ci-only-root-password
      E2E_USERNAME: browser_tester
      E2E_PASSWORD: ci-only-browser-password-0123456789
      E2E_BASE_URL: https://localhost:8443
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Certificado para teste local
        run: python scripts/create_local_tls.py
      - name: Construir e iniciar conjunto completo
        run: docker compose -f compose.full.yaml up --build --detach --wait --wait-timeout 240
      - name: Preparar inventário e usuário temporário
        run: |
          docker compose -f compose.full.yaml exec -T api python manage.py seed_demo
          docker compose -f compose.full.yaml exec -T -e E2E_USERNAME -e E2E_PASSWORD api python manage.py shell -c 'import os; from django.contrib.auth import get_user_model; get_user_model().objects.create_user(os.environ["E2E_USERNAME"], password=os.environ["E2E_PASSWORD"], is_staff=True)'
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - name: Navegadores reais desktop e mobile
        run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Diagnóstico dos serviços
        if: failure()
        run: docker compose -f compose.full.yaml logs --no-color
      - name: Encerrar ambiente temporário
        if: always()
        run: docker compose -f compose.full.yaml down --volumes
